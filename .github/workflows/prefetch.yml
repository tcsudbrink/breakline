# Every 10 minutes: check NOAA for new charts in each zone and publish our own copy to GitHub Pages
# (https://<owner>.github.io/<repo>/live/). The app loads these in about a second, falls back to them
# when NOAA is down, and Find your water searches them. Only republishes when something is new.
name: prefetch

on:
  schedule:
    - cron: "*/10 * * * *"    # GitHub can run these a few minutes late under load
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write          # lets each run queue the next one (GitHub's own schedule skips runs when it's busy)

concurrency:
  group: prefetch
  cancel-in-progress: false

jobs:
  prefetch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy1.outputs.page_url }}
    steps:
      - id: start
        run: echo "t=$(date +%s)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/prefetch.yml
      - run: pip install numpy pillow h5py
      - name: Fetch charts (starts from what is already published)
        id: fetch
        env:
          LIVE_SEED: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/live
          PREFETCH_BUDGET_S: "480"
        run: |
          mkdir -p site/live
          python prefetch.py site/live
          echo "<p>Breakline data. The app is at https://www.breaklinefishing.com/app</p>" > site/index.html
      - uses: actions/configure-pages@v5
        if: steps.fetch.outputs.changed == 'true'
      - uses: actions/upload-pages-artifact@v5
        if: steps.fetch.outputs.changed == 'true'
        with:
          path: site
      # GitHub sometimes can't see the just-uploaded artifact for a few seconds
      # ("No artifacts named github-pages"), so wait and retry before failing the run.
      - name: Let the artifact settle
        if: steps.fetch.outputs.changed == 'true'
        run: sleep 15
      - id: deploy1
        if: steps.fetch.outputs.changed == 'true'
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - name: Wait before retry
        if: steps.fetch.outputs.changed == 'true' && steps.deploy1.outcome == 'failure'
        run: sleep 45
      - id: deploy
        if: steps.fetch.outputs.changed == 'true' && steps.deploy1.outcome == 'failure'
        uses: actions/deploy-pages@v5
      # New charts are up: re-check everyone's water alerts (the site emails anyone whose water just showed up)
      - name: Check water alerts
        if: steps.fetch.outputs.changed == 'true'
        continue-on-error: true
        run: curl -s -m 70 -X POST https://www.breaklinefishing.com/api/check-alerts || true
      # Pre-load the CDN with NOAA tiles for the main fishing grounds (runs on Vercel's East Coast region; see api/warm.js)
      - name: Warm the tile cache
        if: always()
        continue-on-error: true
        run: curl -s -m 70 https://www.breaklinefishing.com/api/warm || true
      # Keep a steady 10-minute rhythm: queue the next run 10 minutes after this one started, unless one is
      # already waiting (so the chain never doubles). The cron above restarts the chain if it ever breaks.
      - name: Queue the next check
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          API: https://api.github.com/repos/${{ github.repository }}/actions
        run: |
          left=$(( 600 - ($(date +%s) - ${{ steps.start.outputs.t }}) ))
          if [ "$left" -gt 0 ]; then sleep "$left"; fi
          waiting=0
          for st in queued pending waiting requested; do
            n=$(curl -s -H "Authorization: Bearer $GH_TOKEN" "$API/workflows/prefetch.yml/runs?status=$st&per_page=1" | python3 -c "import sys,json; print(json.load(sys.stdin).get('total_count',0))")
            waiting=$((waiting + n))
          done
          if [ "$waiting" = "0" ]; then
            curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$API/workflows/prefetch.yml/dispatches" -d '{"ref":"${{ github.ref_name }}"}'
            echo "queued the next run"
          else
            echo "a run is already waiting"
          fi
